<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">

    <title>Encriptador</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

</head>
<body>

    <div>

        <form onsubmit="Codificar(); event.preventDefault();">
            <input class="Key" placeholder="Key (3A)" maxlength="2" type="text">
            <input class="Nombre" placeholder="Nombre" type="text">
            <input type="submit" value="Encriptar">
            <p class="Encriptado">Salida</p>
        </form>
    
        <form onsubmit="Descodificar(); event.preventDefault();">
            <input class="Codigo" placeholder="Código" type="text">
            <input type="submit" value="Desencriptar">
            <p class="Desencriptado">Salida</p>
        </form>

    </div>

    <script src="script.js"></script>
    
</body>
</html>
